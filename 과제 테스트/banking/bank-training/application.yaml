server:
  port: 8080

spring:
  # ===== H2 메모리 DB (설치 불필요) =====
  datasource:
    url: "jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  # ===== H2 웹 콘솔 =====
  h2:
    console:
      enabled: true
  # ===== Thymeleaf =====
  thymeleaf:
    # 개발 중에는 캐시를 꺼서 템플릿 수정이 바로 반영되게 함
    cache: false
